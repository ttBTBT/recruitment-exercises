<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>开放原子 · 活动报名</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#182a39;background:#f3f6f8;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 17px;background:#176859;color:white;font-weight:650}button.secondary{background:#eaf1ef;color:#235b50}button.danger{background:#fff0ed;color:#a43124}button:disabled{opacity:.5;cursor:not-allowed}a{color:inherit}.shell{max-width:1140px;margin:auto;padding:0 28px}header{background:white;border-bottom:1px solid #e1e7eb}.nav{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:20px;font-weight:800;letter-spacing:1px}.brand span{color:#176859}.nav-actions,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hero{padding:52px 0 32px;display:flex;justify-content:space-between;align-items:end;gap:24px}.eyebrow{color:#176859;font-weight:700;letter-spacing:2px;font-size:12px}h1{font-size:40px;margin:14px 0;letter-spacing:-1px}p{line-height:1.7;color:#637483}.hero p{margin:0}.filter{background:white;padding:18px;border:1px solid #e1e7eb;border-radius:14px;display:flex;gap:12px;margin-bottom:24px}.filter input{flex:1;min-width:120px}input,textarea,select{border:1px solid #ced8df;padding:11px 12px;border-radius:8px;background:white;color:#182a39}input:focus,textarea:focus,select:focus{outline:2px solid #72b9a8;outline-offset:1px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;border:1px solid #e1e7eb;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.card-top{padding:23px 23px 12px;background:linear-gradient(135deg,#eef5f2,#f8fafb);min-height:105px}.badge{display:inline-block;padding:4px 9px;border-radius:6px;font-size:12px;font-weight:700;background:#e0f0e9;color:#236a54}.badge.ended{background:#e7ebef;color:#607080}.card h2{font-size:20px;line-height:1.4;margin:15px 0 8px;overflow-wrap:anywhere}.card-body{padding:18px 23px 23px;flex:1;display:flex;flex-direction:column}.description{margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.meta{font-size:13px;color:#637483;margin:7px 0}.card-bottom{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-size:12px;color:#637483}.pagination{display:flex;justify-content:center;align-items:center;gap:16px;margin:30px 0}.empty{text-align:center;background:white;padding:64px 24px;border-radius:14px;color:#637483;grid-column:1/-1}.notice{padding:13px 18px;border-radius:9px;margin:0 0 20px;background:#fff0ed;color:#99382d;white-space:pre-wrap;overflow-wrap:anywhere}.notice.success{background:#e0f0e9;color:#236a54}[hidden]{display:none!important}dialog{border:0;border-radius:18px;padding:28px;width:min(560px,calc(100vw - 28px));max-height:90vh;color:#182a39;box-shadow:0 20px 100px #142f3540}dialog::backdrop{background:#14212d70}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.dialog-head h2{margin:0;font-size:24px}.close{background:#edf1f4;color:#536575;padding:6px 12px;font-size:22px}form label{display:block;margin:15px 0 6px;font-weight:650;font-size:13px}form input,form textarea{width:100%}textarea{resize:vertical;min-height:110px}.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}.detail-description{white-space:pre-wrap;overflow-wrap:anywhere}.detail-meta{background:#f3f6f8;border-radius:12px;padding:15px;margin:20px 0}.small{font-size:12px;color:#637483}footer{padding:28px 0 35px;color:#7b8994;font-size:12px;border-top:1px solid #e1e7eb;margin-top:35px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}.hero{align-items:start;flex-direction:column}}@media(max-width:520px){.shell{padding:0 18px}.grid{grid-template-columns:1fr}.nav{align-items:start;padding:18px 0}.brand{font-size:17px}.nav-actions{justify-content:flex-end;gap:6px}.nav-actions button{padding:8px 10px}.hero{padding:32px 0 24px}.filter{flex-wrap:wrap}.filter input{width:100%;flex-basis:100%}.filter select{flex:1}}
</style>
</head>
<body>
<header><div class="shell nav"><div class="brand"><span>◈</span> 开放原子 <span class="small">/ 活动空间</span></div><div class="nav-actions"><span id="account" class="small"></span><button id="loginButton" class="secondary">登录 / 注册</button><button id="logoutButton" class="secondary" hidden>退出</button></div></div></header>
<main class="shell"><section class="hero"><div><div class="eyebrow">CONNECT · EXPLORE · BUILD</div><h1>下一次相遇，从这里开始。</h1><p>发现感兴趣的活动，和伙伴一起学习、交流与创造。</p></div><button id="createButton">＋ 发起活动</button></section>
<div id="notice" role="alert" class="notice" hidden></div>
<form id="filterForm" class="filter"><input id="keyword" aria-label="搜索活动" placeholder="搜索活动标题或内容…" maxlength="100"><select id="status" aria-label="活动状态"><option value="">全部活动</option><option value="UPCOMING">即将开始</option><option value="ENDED">已结束</option></select><button type="submit">搜索活动</button></form>
<div class="row" style="justify-content:space-between;margin-bottom:18px"><strong>探索活动</strong><span id="total" class="small"></span></div><section id="events" class="grid" aria-live="polite"></section><div class="pagination"><button id="previous" class="secondary">上一页</button><span id="pageLabel" class="small"></span><button id="next" class="secondary">下一页</button></div></main>
<footer><div class="shell">开放原子工作室 · 让每一个想法，都有一起实现的人。</div></footer>
<dialog id="authDialog"><div class="dialog-head"><h2 id="authTitle">欢迎回来</h2><button class="close" data-close="authDialog" aria-label="关闭">×</button></div><p id="authHint">登录后即可报名活动，也可以发起自己的活动。</p><div id="authError" class="notice" role="alert" hidden></div><form id="authForm"><label for="username">用户名</label><input id="username" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_]{3,50}" title="用户名为3至50个英文字母、数字或下划线"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="72"><div class="form-actions"><button type="button" id="authSwitch" class="secondary">创建账号</button><button id="authSubmit" type="submit">登录</button></div></form></dialog>
<dialog id="editDialog"><div class="dialog-head"><h2 id="editTitle">发起活动</h2><button class="close" data-close="editDialog" aria-label="关闭">×</button></div><div id="editError" class="notice" role="alert" hidden></div><form id="editForm"><label for="title">活动标题</label><input id="title" required maxlength="100"><label for="description">活动介绍</label><textarea id="description" required maxlength="5000"></textarea><label for="location">活动地点</label><input id="location" required maxlength="200"><label for="eventTime">开始时间（本地时间）</label><input id="eventTime" type="datetime-local" required><label for="capacity">报名人数上限</label><input id="capacity" type="number" min="1" max="100000" required value="30"><div class="form-actions"><button type="button" class="secondary" data-close="editDialog">取消</button><button type="submit">保存活动</button></div></form></dialog>
<dialog id="detailDialog"><div class="dialog-head"><h2 id="detailTitle">活动详情</h2><button class="close" data-close="detailDialog" aria-label="关闭">×</button></div><div id="detailError" class="notice" role="alert" hidden></div><div id="detailContent"></div><div id="detailActions" class="form-actions"></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let token=localStorage.getItem('openatom.token'),user=null,page=0,totalPages=0,registerMode=false,editingId=null,listRequest=0;
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function showError(id,message,success=false){const el=$(id);el.textContent=message;el.hidden=!message;el.classList.toggle('success',success)}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers};let response;try{response=await fetch('/api'+path,{...options,headers})}catch(e){throw Error('网络连接失败，请检查网络或确认服务已启动。')}let result;try{result=await response.json()}catch(e){throw Error('服务器返回了无法识别的响应。')}if(!response.ok||result.code!==0){if(response.status===401){token=null;user=null;localStorage.removeItem('openatom.token');updateAccount()}throw Error(result.message||'请求失败，请稍后重试。')}return result.data}
function updateAccount(){$('account').textContent=user?'你好，'+user.username:'';$('loginButton').hidden=!!user;$('logoutButton').hidden=!user}
function date(value){return new Date(value).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function ended(e){return new Date(e.eventTime).getTime()<=Date.now()}
function openAuth(){showError('authError','');$('authDialog').showModal()}
function requireUser(){if(user)return true;openAuth();return false}
async function loadEvents(){const request=++listRequest;$('events').replaceChildren(node('div','正在加载活动…','empty'));$('previous').disabled=true;$('next').disabled=true;try{const params=new URLSearchParams({page:String(page),size:'6',keyword:$('keyword').value.trim(),status:$('status').value});const data=await api('/events?'+params);if(request!==listRequest)return;totalPages=data.totalPages;$('total').textContent='共 '+data.totalElements+' 场活动';$('pageLabel').textContent=totalPages?'第 '+(page+1)+' / '+totalPages+' 页':'暂无活动';$('previous').disabled=page===0;$('next').disabled=page+1>=totalPages;$('events').replaceChildren();if(!data.content.length)$('events').append(node('div','暂时没有符合条件的活动，试试其他关键词吧。','empty'));for(const e of data.content){const card=node('article',undefined,'card'),top=node('div',undefined,'card-top');top.append(node('span',e.cancelled?'已取消':ended(e)?'已结束':'即将开始','badge'+(e.cancelled||ended(e)?' ended':'')),node('h2',e.title));const body=node('div',undefined,'card-body');body.append(node('p',e.description,'description'),node('div','◷ '+date(e.eventTime),'meta'),node('div','⌖ '+e.location,'meta'),node('div','发起人 · '+e.organizerName,'meta'));const bottom=node('div',undefined,'card-bottom'),button=node('button','查看详情','secondary');button.onclick=()=>openDetail(e.id);bottom.append(node('span',e.registeredCount+' / '+e.capacity+' 人已报名','count'),button);body.append(bottom);card.append(top,body);$('events').append(card)}}catch(e){if(request!==listRequest)return;$('events').replaceChildren(node('div','活动加载失败，请点击搜索重试。','empty'));showError('notice',e.message)}}
async function openDetail(id){showError('detailError','');$('detailTitle').textContent='活动详情';$('detailContent').replaceChildren(node('p','正在加载…'));$('detailActions').replaceChildren();if(!$('detailDialog').open)$('detailDialog').showModal();try{const e=await api('/events/'+id);$('detailTitle').textContent=e.title;const meta=node('div',undefined,'detail-meta');meta.append(node('div','时间 · '+date(e.eventTime),'meta'),node('div','地点 · '+e.location,'meta'),node('div','发起人 · '+e.organizerName,'meta'),node('div','报名 · '+e.registeredCount+' / '+e.capacity+' 人','meta'));$('detailContent').replaceChildren(node('span',e.cancelled?'已取消':ended(e)?'已结束':'即将开始','badge'),meta,node('p',e.description,'detail-description'));let registered=false;if(user)registered=(await api('/events/'+id+'/registrations/me')).registered;const actions=$('detailActions');if(user&&user.userId===e.organizerId&&!e.cancelled){const edit=node('button','编辑活动','secondary');edit.onclick=()=>{$('detailDialog').close();openEdit(e)};const cancel=node('button','取消活动','danger');cancel.onclick=async()=>{if(!confirm('确定取消这个活动吗？取消后将无法继续报名。'))return;cancel.disabled=true;try{await api('/events/'+id,{method:'DELETE'});await openDetail(id);await loadEvents()}catch(err){showError('detailError',err.message);cancel.disabled=false}};actions.append(edit,cancel)}const join=node('button',registered?'已报名':e.cancelled?'活动已取消':ended(e)?'活动已结束':e.registeredCount>=e.capacity?'名额已满':'报名参加');join.disabled=registered||e.cancelled||ended(e)||e.registeredCount>=e.capacity;join.onclick=async()=>{if(!requireUser())return;join.disabled=true;try{await api('/events/'+id+'/registrations',{method:'POST'});await openDetail(id);await loadEvents()}catch(err){showError('detailError',err.message);join.disabled=false}};actions.append(join)}catch(e){showError('detailError',e.message)}}
function openEdit(e){if(!requireUser())return;editingId=e?e.id:null;$('editForm').reset();$('editTitle').textContent=e?'编辑活动':'发起活动';showError('editError','');if(e){for(const key of ['title','description','location','capacity'])$(key).value=e[key];const d=new Date(e.eventTime);$('eventTime').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('editDialog').showModal()}
$('filterForm').onsubmit=e=>{e.preventDefault();page=0;showError('notice','');loadEvents()};$('previous').onclick=()=>{if(page>0){page--;loadEvents()}};$('next').onclick=()=>{if(page+1<totalPages){page++;loadEvents()}};$('loginButton').onclick=openAuth;$('createButton').onclick=()=>openEdit();$('logoutButton').onclick=()=>{token=null;user=null;localStorage.removeItem('openatom.token');updateAccount();if($('detailDialog').open)$('detailDialog').close();showError('notice','已退出登录。',true)};
document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>$(el.dataset.close).close());
$('authSwitch').onclick=()=>{registerMode=!registerMode;$('authTitle').textContent=registerMode?'创建新账号':'欢迎回来';$('authSubmit').textContent=registerMode?'注册并登录':'登录';$('authSwitch').textContent=registerMode?'已有账号，去登录':'创建账号';$('password').autocomplete=registerMode?'new-password':'current-password';showError('authError','')};
$('authForm').onsubmit=async e=>{e.preventDefault();const button=$('authSubmit');button.disabled=true;showError('authError','');try{if(new TextEncoder().encode($('password').value).length>72)throw Error('密码的 UTF-8 编码长度不能超过72字节，请缩短密码。');const body=JSON.stringify({username:$('username').value.trim(),password:$('password').value});if(registerMode)await api('/auth/register',{method:'POST',body});const data=await api('/auth/login',{method:'POST',body});token=data.token;user=data;localStorage.setItem('openatom.token',token);updateAccount();$('authDialog').close();$('authForm').reset();showError('notice','登录成功，可以报名或发起活动了。',true);if($('detailDialog').open)$('detailDialog').close()}catch(err){showError('authError',err.message)}finally{button.disabled=false}};
$('editForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;showError('editError','');try{const body=JSON.stringify({title:$('title').value.trim(),description:$('description').value.trim(),location:$('location').value.trim(),eventTime:new Date($('eventTime').value).toISOString(),capacity:Number($('capacity').value)});await api('/events'+(editingId?'/'+editingId:''),{method:editingId?'PUT':'POST',body});$('editDialog').close();showError('notice',editingId?'活动已更新。':'活动已发布。',true);page=0;await loadEvents()}catch(err){showError('editError',err.message)}finally{button.disabled=false}};
(async()=>{if(token){try{user=await api('/auth/login',{method:'POST',body:'{}'})}catch(e){token=null;localStorage.removeItem('openatom.token');showError('notice','登录状态已失效，请重新登录。')}}updateAccount();await loadEvents()})();
</script>
</body></html>
