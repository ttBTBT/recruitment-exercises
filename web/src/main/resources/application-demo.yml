# Local demonstration only; MySQL + Redis are used by the mysql profile.
spring:
  datasource:
    url: jdbc:h2:mem:events;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s
app:
  jwt-secret: demo-only-secret-change-before-deploy-2026-64-characters-minimum-value
